worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    upstream api {
        server api1:8080 max_fails=0;
        server api2:8080 max_fails=0;
        keepalive 1024;
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
