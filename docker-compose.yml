version: '3.8'

services:
  api1: &api
    build: .
    hostname: api1
    environment:
      - PORT=8080
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M

  api2:
    <<: *api
    hostname: api2

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 30M
